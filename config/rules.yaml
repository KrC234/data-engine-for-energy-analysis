version: "2.0.0"


# ==========================================================
# TERRITORIO
# ==========================================================

territory:

  source_file: "config/data/zonas_toluca.csv"

  services_distribution:
    method: "weighted_by_housing"
    field: "viviendas_habitadas"

  socioeconomic_factor:
    field: "factor_socioeconomico"
    apply_to_consumption: true
    apply_to_fraud_probability: false

  urban_type:
    method: "hsd_factor_classification"

    thresholds:
      RESIDENCIAL_ALTA:
        min: 1.75

      RESIDENCIAL_MEDIA:
        min: 1.50
        max: 1.749

      MIXTA:
        min: 1.20
        max: 1.499

      POPULAR:
        min: 0.90
        max: 1.199

      PERIFERIA:
        min: 0.50
        max: 0.899


# ==========================================================
# PADRON
# ==========================================================

services:

  total: 5000

  category_distribution:

    RESIDENCIAL: 0.780
    COMERCIAL: 0.071
    PUBLICO: 0.030
    SERVICIO: 0.014
    ALUMBRADO: 0.068
    MOVILIDAD: 0.037

  solar_probability:

    RESIDENCIAL: 0.08
    COMERCIAL: 0.12
    PUBLICO: 0.15
    SERVICIO: 0.05
    ALUMBRADO: 0.00
    MOVILIDAD: 0.00


# ==========================================================
# TIPOS DE SERVICIO
# ==========================================================

service_types:

  VIV_UNIF:
    name: "Vivienda unifamiliar"
    category: "RESIDENCIAL"
    base_kwh_h: 0.350
    dispersion: 0.42
    temperature_sensitivity: 0.045

  VIV_DEPTO:
    name: "Departamento"
    category: "RESIDENCIAL"
    base_kwh_h: 0.240
    dispersion: 0.38
    temperature_sensitivity: 0.038

  VIV_SOCIAL:
    name: "Vivienda de interes social"
    category: "RESIDENCIAL"
    base_kwh_h: 0.190
    dispersion: 0.35
    temperature_sensitivity: 0.030

  VIV_RESID:
    name: "Vivienda de consumo alto"
    category: "RESIDENCIAL"
    base_kwh_h: 0.980
    dispersion: 0.55
    temperature_sensitivity: 0.075

  COM_LOCAL:
    name: "Local comercial de barrio"
    category: "COMERCIAL"
    base_kwh_h: 1.100
    dispersion: 0.48
    temperature_sensitivity: 0.040

  MERCADO:
    name: "Mercado publico municipal"
    category: "PUBLICO"
    base_kwh_h: 18.500
    dispersion: 0.30
    temperature_sensitivity: 0.055

  ESCUELA:
    name: "Escuela publica"
    category: "PUBLICO"
    base_kwh_h: 6.400
    dispersion: 0.28
    temperature_sensitivity: 0.035

  CLINICA:
    name: "Centro de salud"
    category: "PUBLICO"
    base_kwh_h: 22.000
    dispersion: 0.25
    temperature_sensitivity: 0.050

  HOSPITAL:
    name: "Hospital"
    category: "PUBLICO"
    base_kwh_h: 85.000
    dispersion: 0.20
    temperature_sensitivity: 0.048

  EDIF_GOB:
    name: "Edificio gubernamental"
    category: "PUBLICO"
    base_kwh_h: 14.200
    dispersion: 0.32
    temperature_sensitivity: 0.060

  BIBLIOTECA:
    name: "Biblioteca publica"
    category: "PUBLICO"
    base_kwh_h: 4.100
    dispersion: 0.30
    temperature_sensitivity: 0.042

  CTRO_CULT:
    name: "Centro cultural"
    category: "PUBLICO"
    base_kwh_h: 5.300
    dispersion: 0.30
    temperature_sensitivity: 0.040

  CTRO_DEP:
    name: "Centro deportivo"
    category: "PUBLICO"
    base_kwh_h: 11.800
    dispersion: 0.35
    temperature_sensitivity: 0.030

  PARQUE:
