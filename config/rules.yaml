  SEMAFORO:
    name: "Nodo de semaforizacion"
    category: "MOVILIDAD"
    base_kwh_h: 0.420
    dispersion: 0.15
    temperature_sensitivity: 0.000


# ==========================================================
# CONSUMO
# ==========================================================

consumption:

  formula:
    base: true
    hourly_profile: true
    socioeconomic_factor: true
    seasonal_factor: true
    random_component: true

  random_distribution:
    type: "normal"
    mean: 0.0
    truncate_sigma: 2.5

  minimum_kwh: 0.0


# ==========================================================
# MEDIDORES
# ==========================================================

meters:

  brands:
    MEDISUR: 0.35
    KRONOS: 0.35
    NOVAMET: 0.30

  base_link_quality:
    min: 75
    max: 99

  link_quality_by_zone: true

  multipliers:
    1: 0.94
    20: 0.03
    40: 0.02
    80: 0.01

  replacements:
    enabled: true
    total: 260


# ==========================================================
# CALENDARIO / TEMPERATURA
# ==========================================================

calendar:

  day_types:
    workday: "H"
    saturday: "S"
    sunday_or_holiday: "D"

  temperature:

    january:
      min_c: [3.0, 8.0]
      max_c: [18.0, 23.0]

    february:
      min_c: [5.0, 10.0]
      max_c: [20.0, 26.0]

    march:
      min_c: [8.0, 14.0]
      max_c: [23.0, 30.0]

  seasonal_factor:

    january: 1.08
    february: 1.03
    march: 0.98


# ==========================================================
# ANOMALIAS
# ==========================================================

events:

  enabled: true

  PICO_DEMANDA:
    effect: "INCREMENTO"
    affects_meter_counter: true
    rate_month: 0.060
    duration_hours: [1, 3]
    intensity: [2.5, 6.0]
    detection_probability: 0.95

  CONSUMO_ANOMALO:
    effect: "INCREMENTO"
    affects_meter_counter: true
    rate_month: 0.040
    duration_hours: [24, 168]
    intensity: [1.4, 2.2]
    detection_probability: 0.70

  MANIPULACION:
    effect: "REDUCCION"
    affects_meter_counter: true
    rate_month: 0.008
    duration_hours: [168, 720]
    intensity: [0.2, 0.6]
    detection_probability: 0.35

  FALLA_MEDIDOR:
    effect: "CONGELAMIENTO"
    affects_meter_counter: true
    rate_month: 0.010
    duration_hours: [12, 336]
    intensity: null
    detection_probability: 0.40

  PERDIDA_COMUNICACION:
    effect: "NULIFICACION"
    affects_meter_counter: false
    rate_month: 0.900
    duration_hours: [1, 24]
    intensity: null
    detection_probability: 0.98

  SOBRECARGA:
    effect: "INCREMENTO"
    affects_meter_counter: true
    rate_month: 0.015
    duration_hours: [1, 6]
    intensity: [1.8, 3.0]
    detection_probability: 0.90

  MANTENIMIENTO:
    effect: "REDUCCION"
    affects_meter_counter: false
    rate_month: 0.020
    duration_hours: [2, 8]
    intensity: [0.0, 0.25]
    detection_probability: 1.00


# ==========================================================
# VIGILANCIA
# ==========================================================

monitoring:

  alert_delay_hours:
    min: 1
    max: 12

  false_alarm_rate_month_per_meter: 0.004