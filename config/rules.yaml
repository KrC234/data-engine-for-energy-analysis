    category: "PUBLICO"
    base_kwh_h: 2.700
    dispersion: 0.25
    temperature_sensitivity: 0.005

  POZO_AGUA:
    name: "Pozo de agua potable"
    category: "SERVICIO"
    base_kwh_h: 42.000
    dispersion: 0.20
    temperature_sensitivity: 0.010

  BOMBEO:
    name: "Planta de rebombeo"
    category: "SERVICIO"
    base_kwh_h: 58.000
    dispersion: 0.18
    temperature_sensitivity: 0.008

  ALUMB_PUB:
    name: "Circuito de alumbrado publico"
