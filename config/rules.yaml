# ============================================================
# REGLAS DE GENERACION
# HyperDataSynthetic
#
# Contiene solamente reglas utilizadas directamente por
# los generadores Python.
#
# Los catalogos de zonas, tarifas, tipos de servicio,
# perfiles horarios y tipos de evento viven en PostgreSQL.
# ============================================================


# ============================================================
# 1. DISTRIBUCION DE SERVICIOS
# ============================================================

services:

  # Los 5,000 servicios se distribuyen entre las zonas según
  # el número de viviendas habitadas de energia.zona.
  #
  # Una zona con más viviendas recibe más servicios sintéticos.
  use_housing_weights: true


  # Distribución del padrón por categoría.
  #
  # La suma debe ser exactamente 1.0.
  #
  # RESIDENCIAL: 78.0% de los servicios
  # COMERCIAL:    7.1%
  # PUBLICO:      3.0%
  # SERVICIO:     1.4%, por ejemplo pozos y bombeo
  # ALUMBRADO:    6.8%
  # MOVILIDAD:    3.7%, por ejemplo semáforos
  category_distribution:

    RESIDENCIAL: 0.780
    COMERCIAL: 0.071
    PUBLICO: 0.030
    SERVICIO: 0.014
    ALUMBRADO: 0.068
    MOVILIDAD: 0.037


  # Probabilidad de que un servicio tenga generación solar.
  #
  # 0.08 significa una probabilidad del 8%.
  # Los circuitos de alumbrado y semáforos quedan en cero.
  solar_probability:

    RESIDENCIAL: 0.08
    COMERCIAL: 0.12
    PUBLICO: 0.15
    SERVICIO: 0.05
    ALUMBRADO: 0.00
    MOVILIDAD: 0.00


  # Ocupación sintética para servicios residenciales.
  #
  # Cada vivienda tendrá entre 1 y 7 ocupantes.
  residential_occupancy:

    min: 1
    max: 7


  # Carga contratada según categoría, expresada en kW.
  #
  # Esta carga se usa posteriormente para detectar eventos
  # de sobrecarga.
  contracted_load_kw:

    RESIDENCIAL:
      min: 1.5
      max: 12.0

    COMERCIAL:
      min: 5.0
      max: 60.0

    PUBLICO:
      min: 15.0
      max: 250.0

    SERVICIO:
      min: 50.0
      max: 350.0

    ALUMBRADO:
      min: 10.0
      max: 120.0

    MOVILIDAD:
      min: 0.5
      max: 5.0


# ============================================================
# 2. MEDIDORES
# ============================================================

meters:

  # Distribución de marcas sintéticas.
  #
  # La suma debe ser exactamente 1.0.
  # Estas marcas no representan fabricantes reales.
  brands:

    MEDISUR: 0.35
    KRONOS: 0.35
    NOVAMET: 0.30


  # Calidad de comunicación del medidor.
  #
  # El esquema de PostgreSQL permite valores entre 50 y 100.
  # Para el escenario normal generaremos valores entre 75 y 99.
  #
  # Un valor de 95 representa aproximadamente una calidad
  # de enlace superior a un medidor con valor 75.
  link_quality:

    min: 75
    max: 99


  # El factor socioeconómico de la zona también se utilizará
  # para ajustar ligeramente la calidad del enlace.
  #
  # true significa que las zonas clasificadas como periféricas
  # pueden obtener valores de enlace ligeramente menores.
  adjust_link_quality_by_zone: true


  # Distribución de multiplicadores.
  #
  # La mayoría de los servicios usa multiplicador 1.
  # Los valores 20, 40 y 80 se reservan principalmente para
  # servicios de mayor carga.
  multipliers:

    1: 0.94
    20: 0.03
    40: 0.02
    80: 0.01


# ============================================================
# 3. CALENDARIO Y TEMPERATURA
# ============================================================

calendar:

  # Rango de temperatura mínima y máxima para cada mes.
  #
  # Estos valores son parámetros del escenario sintético.
  # El generador seleccionará un valor dentro del rango.
  temperature:

    january:

      # Temperatura mínima diaria entre 3 y 8 grados Celsius.
      min_c: [3.0, 8.0]

      # Temperatura máxima diaria entre 18 y 23 grados Celsius.
      max_c: [18.0, 23.0]


    february:

      # Febrero presenta un aumento moderado de temperatura.
      min_c: [5.0, 10.0]
      max_c: [20.0, 26.0]


    march:

      # Marzo presenta las temperaturas más altas del trimestre.
      min_c: [8.0, 14.0]
      max_c: [23.0, 30.0]


  # Factor que modifica el consumo general según el mes.
  #
  # 1.08 significa que enero incrementa el consumo base 8%.
  # 1.03 significa que febrero incrementa el consumo base 3%.
  # 0.98 significa que marzo reduce el consumo base 2%.
  seasonal_factor:

    january: 1.08
    february: 1.03
    march: 0.98


# ============================================================
# 4. VARIACION DEL CONSUMO
# ============================================================

consumption:

  # Límite inferior permitido.
  # Ninguna lectura real puede ser negativa.
  minimum_kwh: 0.0


  # Limita el ruido aleatorio alrededor del consumo esperado.
  #
  # El factor se seleccionará entre 0.90 y 1.10.
  #
  # Ejemplo:
  # consumo esperado = 1.000 kWh
  #
  # consumo generado mínimo aproximado = 0.900 kWh
  # consumo generado máximo aproximado = 1.100 kWh
  random_factor:

    min: 0.90
    max: 1.10


  # Determina si el factor socioeconómico de energia.zona
  # modifica el consumo.
  #
  # Ejemplo:
  # consumo base       = 0.350
  # factor de zona     = 1.500
  #
  # consumo ajustado   = 0.350 x 1.500
  use_socioeconomic_factor: true


  # Determina si el factor mensual almacenado en calendario
  # modifica el consumo.
  use_seasonal_factor: true


  # Determina si se utiliza el perfil horario almacenado en
  # energia.perfil_carga_horaria.
  use_hourly_profile: true


# ============================================================
# 5. GENERACION SOLAR
# ============================================================

solar:

  # Horas en las que se aplica una reducción de consumo neto
  # a los servicios que tienen generación solar.
  start_hour: 9
  end_hour: 17


  # Reducción del consumo durante las horas solares.
  #
  # El valor se seleccionará entre 15% y 45%.
  reduction:

    min: 0.15
    max: 0.45